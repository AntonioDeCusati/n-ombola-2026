<div class="game-page">
  <header class="christmas-header">
    <button class="header-action" (click)="goBack()">
      <i class="bi bi-box-arrow-left"></i>
      Esci
    </button>
    <img src="nesea-natalizia.png" class="hero-logo" alt="Nesea Natale" />

    <div class="hero-content">
      <div class="hero-badge">🎄 Tombola Natalizia Nesea 2026 🎄</div>
      <h1>Tombola Aziendale</h1>
    </div>
  </header>

  <section class="hero-number">
    <div class="last-number-card">
      <span class="number-label"> ULTIMO NUMERO ESTRATTO </span>

      <div class="last-number">{{ lastNumber() ?? '--' }}</div>

      <div class="number-counter">Estratti {{ extractedCount() }}/90</div>
      <button
        class="extract-btn"
        [disabled]="loading()"
        (click)="extractNumber()"
      >
        🎲 ESTRAI NUMERO
      </button>
      @if (autoExtraction()) {
      <button class="auto-card" (click)="toggleAutoExtraction()">
        <div class="auto-title">🤖 Estrazione automatica attiva</div>

        <div class="auto-countdown">
          ⏳ Prossimo numero tra {{ countdown() }}s
        </div>
      </button>
      } @if (!autoExtraction()) {
      <button class="auto-card inactive" (click)="toggleAutoExtraction()">
        <div class="auto-title">▶️ Attiva estrazione automatica</div>
      </button>
      }
    </div>
  </section>

  <section class="board-card">
    <div class="board-grid">
      @for (number of boardNumbers; track number) {

      <div
        class="number-cell"
        [class.extracted]="isExtracted(number)"
        [class.latest]="isLastExtracted(number)"
      >
        {{ number }}
      </div>

      }
    </div>
  </section>
</div>

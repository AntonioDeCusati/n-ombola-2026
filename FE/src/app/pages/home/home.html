<div class="page-container">
  <div class="logo-container">
    <h1 class="logo-title">N-Tombola</h1>
  </div>

  <!-- PLAYER -->

  <div class="role-card">
    <span class="role-badge role-badge-player"> SMARTPHONE </span>

    <div class="d-flex align-items-start gap-3">
      <div class="role-icon player-icon">
        <i class="bi bi-phone"></i>
      </div>

      <div>
        <h3 class="role-title">Giocatore</h3>

        <p class="role-description">
          Ricevi la tua cartella 3×9 in orizzontale ed entra istantaneamente con
          codice di invito.
        </p>
      </div>
    </div>

    <hr />

    <button class="btn btn-player w-100" (click)="enterAsPlayer()">
      Entra come Giocatore

      <i class="bi bi-arrow-right ms-2"></i>
    </button>
  </div>

  <!-- HOST -->

  <div class="role-card mt-4">
    <div class="d-flex align-items-start gap-3">
      <div class="role-icon host-icon">
        <i class="bi bi-display"></i>
      </div>

      <div>
        <div class="d-flex align-items-center gap-2">
          <h3 class="role-title mb-0">Banco</h3>

          <span class="role-badge-host"> HOST </span>
        </div>

        <p class="role-description mt-2">
          Schermo sala o proiettore con tabellone 1-90 completo, estrazioni e
          verifica vincite.
        </p>
      </div>
    </div>

    <hr />

    <button class="btn btn-host w-100" (click)="enterAsHost()">
      Console Banco

      <i class="bi bi-sliders2 ms-2"></i>
    </button>
  </div>
</div>
